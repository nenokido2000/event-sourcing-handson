# Gauge の実行環境（既定）。ここの値は実行プロセスの環境変数として渡る。
# すでに環境変数が設定されている場合はそちらが優先されるため、M8 では本番エンドポイントを
# 環境変数で差し替えるだけで同じ Spec が回る（docs/decisions.md H37）。

# ※ Spec の置き場はここに書かない。Gauge プロジェクトはリポジトリルートなので、
#    実行時に位置引数 `specs/warehouse` を渡すのが正（docs/decisions.md H37 の再改訂）。

# 受入対象アプリのベース URL。アプリは別端末で手動起動しておく
WAREHOUSE_BASE_URL = http://localhost:8080

# ブラウザは使わない（Playwright は APIRequestContext のみ）。ブラウザのダウンロードを抑止する
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = 1

# 結果整合の待ち。投影が追いつくまでステップ実装がポーリングする上限（H38）。
# Spec には待ち時間を書かないので、遅い環境ではここだけを伸ばす
WAREHOUSE_PROJECTION_TIMEOUT_MS = 5000

# レポート・ログ。Gauge プロジェクトがルートになったので、既定のままだとリポジトリ直下に
# logs/ と reports/ が生まれる。受入テストの成果物なので warehouse-atdd/ 配下へ寄せる
logs_directory = warehouse-atdd/logs
gauge_reports_dir = warehouse-atdd/reports
overwrite_reports = true
screenshot_on_failure = false
