[versions]
springBoot = "4.1.0"
axon = "4.13.2"
# 受入テスト（ATDD）。選定の理由は docs/decisions.md H37
# HTTP クライアントは JDK 標準の java.net.http.HttpClient（H50 で Playwright を廃止）
gaugeJava = "1.0.3"

[libraries]
# BOM / platform（バージョン集中管理）
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
axon-bom = { module = "org.axonframework:axon-bom", version.ref = "axon" }

# Axon（版は axon-bom が管理）
axon-modelling = { module = "org.axonframework:axon-modelling" }
axon-eventsourcing = { module = "org.axonframework:axon-eventsourcing" }
axon-messaging = { module = "org.axonframework:axon-messaging" }
# @ProcessingGroup（ポリシーと投影を別グループに分ける / docs/decisions.md H30）
axon-configuration = { module = "org.axonframework:axon-configuration" }
axon-spring-boot-starter = { module = "org.axonframework:axon-spring-boot-starter" }
axon-test = { module = "org.axonframework:axon-test" }

# Spring Boot（版は spring-boot-dependencies が管理）
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-context = { module = "org.springframework:spring-context" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
postgresql = { module = "org.postgresql:postgresql" }

# テスト（版は spring-boot-dependencies が管理）
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
# Axon の AggregateTestFixture#expectException が API に Matcher を持つため、テストの明示依存にする
hamcrest = { module = "org.hamcrest:hamcrest" }
mockito-core = { module = "org.mockito:mockito-core" }

# イベントの永続化形式（版は spring-boot-dependencies が管理 / docs/decisions.md H52）
# 注釈だけ Jackson 2 の成果物のまま（Jackson 3 の databind が参照している）。パッケージも com.fasterxml.jackson.annotation
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
# イベントのJSONを固定するテストが Jackson3Serializer を直接使うため（axon-messaging は Jackson を推移的に持たない / H35）
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

# 受入テスト（版はこのファイルが正 / H37）
gauge-java = { module = "com.thoughtworks.gauge:gauge-java", version.ref = "gaugeJava" }
# 受入ステップがリードモデルの応答を読むため。版は spring-boot-dependencies が管理
gson = { module = "com.google.code.gson:gson" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
